name: CI Pipeline - Ultra Strict 2025

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'
  CI: true
  # Treat warnings as errors
  ESLINT_NO_DEV_ERRORS: true
  TSC_COMPILE_ON_ERROR: false

jobs:
  # Job 1: Install and Cache Dependencies
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

  # Job 2: TypeScript Type Checking
  typecheck:
    name: TypeScript Type Checking
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run TypeScript Compilation
        run: |
          pnpm run type-check
          if [ $? -ne 0 ]; then
            echo "::error::TypeScript compilation failed"
            exit 1
          fi

  # Job 3: Linting with Zero Tolerance
  lint:
    name: ESLint - Zero Tolerance
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run ESLint (zero warnings)
        run: pnpm lint -- --max-warnings 0

  # Job 4: Prettier Formatting Check
  format:
    name: Prettier Formatting
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Check Formatting
        run: |
          pnpm run format:check
          if [ $? -ne 0 ]; then
            echo "::error::Code is not properly formatted. Run 'pnpm run format' locally"
            exit 1
          fi

  # Job 5: Unit Tests with Coverage
  test:
    name: Unit Tests & Coverage
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run Tests with Coverage
        run: |
          pnpm run test:coverage
          if [ $? -ne 0 ]; then
            echo "::error::Tests failed"
            exit 1
          fi

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true

  # Job 6: E2E Tests
  e2e:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E Tests
        run: |
          pnpm run test:e2e
          if [ $? -ne 0 ]; then
            echo "::error::E2E tests failed"
            exit 1
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Job 7: Accessibility Tests
  a11y:
    name: Accessibility Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run Accessibility Tests
        run: |
          pnpm run test:a11y
          if [ $? -ne 0 ]; then
            echo "::error::Accessibility tests failed"
            exit 1
          fi

  # Job 8: Build Verification
  build:
    name: Build Verification
    needs: [typecheck, lint, format, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Cache
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Build All Packages
        run: |
          pnpm run build
          if [ $? -ne 0 ]; then
            echo "::error::Build failed"
            exit 1
          fi

      - name: Verify Build Output
        run: |
          # Check that all expected build outputs exist
          [ -d "apps/web/.next" ] || { echo "::error::Next.js build output missing"; exit 1; }
          [ -d "packages/core/dist" ] || { echo "::error::Core package build output missing"; exit 1; }
          [ -d "packages/ui/dist" ] || { echo "::error::UI package build output missing"; exit 1; }

  # Job 9: Security Audit
  security:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Run Security Audit
        run: |
          pnpm audit --audit-level=moderate
          if [ $? -ne 0 ]; then
            echo "::warning::Security vulnerabilities found"
          fi

  # Job 10: Final Quality Gate
  quality-gate:
    name: Quality Gate - All Checks Passed
    needs: [typecheck, lint, format, test, e2e, a11y, build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Quality Gate Passed
        run: |
          echo "✅ All quality checks passed!"
          echo "✅ TypeScript: PASSED"
          echo "✅ ESLint: PASSED (Zero Warnings)"
          echo "✅ Prettier: PASSED"
          echo "✅ Unit Tests: PASSED"
          echo "✅ E2E Tests: PASSED"
          echo "✅ Accessibility: PASSED"
          echo "✅ Build: PASSED"
          echo "✅ Security: PASSED"
          echo ""
          echo "🎉 Code meets 2025 production standards!"
