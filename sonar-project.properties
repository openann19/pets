# SonarQube Configuration for PawfectMatch Premium
# Enterprise-grade quality gates and analysis

# Project identification
sonar.projectKey=pawfectmatch-premium
sonar.projectName=PawfectMatch Premium
sonar.projectVersion=1.0.0
sonar.organization=pawfectmatch

# Source code configuration
sonar.sources=apps/web/src,server/src,packages
sonar.tests=apps/web/src/__tests__,tests,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/cypress/**,**/logs/**,**/*.config.js,**/*.config.ts

# TypeScript configuration
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# Test coverage configuration
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/setupTests.ts,**/test-utils.tsx,**/constants/**,**/types/**,**/*.d.ts

# Quality gate thresholds (A-grade requirements)
sonar.coverage.minimum=80
sonar.coverage.target=90

# Reliability rating (A = Excellent)
sonar.reliability.rating.minimum=A
sonar.bugs.minimum=0

# Security rating (A = Excellent)  
sonar.security.rating.minimum=A
sonar.vulnerabilities.minimum=0
sonar.security.hotspots.minimum=0

# Maintainability rating (A = Excellent)
sonar.maintainability.rating.minimum=A
sonar.code_smells.minimum=0

# Duplicated code
sonar.duplicated_lines_density.maximum=3.0

# Complexity
sonar.complexity.maximum=10
sonar.function_complexity.maximum=5

# Lines of code
sonar.lines.maximum=1000

# File size
sonar.file_size.maximum=500

# Cognitive complexity
sonar.cognitive_complexity.maximum=15

# Technical debt
sonar.sqale_index.maximum=5

# Language-specific rules
sonar.typescript.eslint.configPath=.eslintrc.js
sonar.javascript.eslint.configPath=.eslintrc.js

# React-specific configuration
sonar.react.file.suffixes=.tsx,.jsx
sonar.react.test.file.suffixes=.test.tsx,.test.jsx,.spec.tsx,.spec.jsx

# Performance and security
sonar.performance.issues.minimum=0
sonar.security.issues.minimum=0

# Code quality metrics
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Analysis configuration
sonar.analysis.mode=publish
sonar.scm.provider=git
sonar.scm.forceReloadAll=true

# Branch analysis
sonar.branch.name=main
sonar.branch.target=main

# Pull request analysis
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=pawfectmatch/premium

# Advanced analysis
sonar.advanced.analysis.mode=advanced
sonar.advanced.analysis.includePatterns=**/*.ts,**/*.tsx,**/*.js,**/*.jsx
sonar.advanced.analysis.excludePatterns=**/node_modules/**,**/dist/**,**/build/**,**/.next/**

# Custom rules and profiles
sonar.profile=Premium Quality Profile
sonar.qualityProfile=Premium Quality Profile

# Integration with CI/CD
sonar.ci.buildNumber=${BUILD_NUMBER}
sonar.ci.buildUrl=${BUILD_URL}

# Environment-specific settings
sonar.environment=production
sonar.environment.name=Production

# Database configuration (if using SonarQube server)
sonar.jdbc.url=jdbc:postgresql://localhost:5432/sonar
sonar.jdbc.username=sonar
sonar.jdbc.password=sonar

# Web server configuration
sonar.web.host=localhost
sonar.web.port=9000
sonar.web.context=/sonar

# Logging
sonar.log.level=INFO
sonar.log.console=true
sonar.log.file=sonar.log

# Performance optimization
sonar.ce.javaOpts=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError
sonar.web.javaOpts=-Xmx1024m -XX:+HeapDumpOnOutOfMemoryError

# Security settings
sonar.security.realm=LDAP
sonar.authenticator.downcase=true
sonar.core.serverBaseURL=https://sonar.pawfectmatch.com

# Plugin configuration
sonar.plugins.downloadOnlyRequired=false
sonar.plugins.risk.consentGiven=true

# Custom quality gates
sonar.qualitygate.conditions=coverage,bugs,vulnerabilities,code_smells,duplicated_lines_density,maintainability_rating,reliability_rating,security_rating

# Notification settings
sonar.notifications.email.enabled=true
sonar.notifications.email.from=noreply@pawfectmatch.com
sonar.notifications.email.to=dev-team@pawfectmatch.com

# Integration with external tools
sonar.integration.jira.enabled=true
sonar.integration.jira.url=https://pawfectmatch.atlassian.net
sonar.integration.jira.projectKey=PM

# Custom metrics
sonar.custom.metrics.enabled=true
sonar.custom.metrics.accessibility=100
sonar.custom.metrics.performance=90
sonar.custom.metrics.mobile_optimization=95

# Advanced security scanning
sonar.security.scan.enabled=true
sonar.security.scan.depth=deep
sonar.security.scan.patterns=**/*.ts,**/*.tsx,**/*.js,**/*.jsx

# Code quality automation
sonar.automation.enabled=true
sonar.automation.autoFix=true
sonar.automation.suggestions=true

# Reporting
sonar.report.export.enabled=true
sonar.report.export.formats=pdf,html,json
sonar.report.export.path=reports/sonar

# Advanced analysis features
sonar.advanced.analysis.newCode=true
sonar.advanced.analysis.leakPeriod=30
sonar.advanced.analysis.periodType=days

# Custom rules for premium code quality
sonar.premium.rules.enabled=true
sonar.premium.rules.accessibility=strict
sonar.premium.rules.performance=strict
sonar.premium.rules.security=strict
sonar.premium.rules.mobile=strict

# Zero tolerance for critical issues
sonar.critical.issues.tolerance=0
sonar.critical.issues.autoFail=true

# Premium quality standards
sonar.premium.standards.enabled=true
sonar.premium.standards.level=enterprise
sonar.premium.standards.compliance=strict

# Continuous quality monitoring
sonar.monitoring.enabled=true
sonar.monitoring.frequency=hourly
sonar.monitoring.alerts=true

# Quality trend analysis
sonar.trends.enabled=true
sonar.trends.period=30
sonar.trends.metrics=coverage,bugs,vulnerabilities,code_smells

# Advanced reporting
sonar.reporting.advanced=true
sonar.reporting.dashboard=true
sonar.reporting.metrics=all
sonar.reporting.export=all

# Integration with development workflow
sonar.workflow.integration=true
sonar.workflow.autoReview=true
sonar.workflow.suggestions=true

# Premium features
sonar.premium.features.enabled=true
sonar.premium.features.advancedSecurity=true
sonar.premium.features.performanceAnalysis=true
sonar.premium.features.accessibilityScanning=true
sonar.premium.features.mobileOptimization=true

# Enterprise compliance
sonar.enterprise.compliance=true
sonar.enterprise.standards=ISO27001,SOC2,GDPR
sonar.enterprise.audit=true
sonar.enterprise.reporting=comprehensive